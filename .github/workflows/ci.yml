name: CI

# Lint + test the merge/ machinery on every PR and push to main. Credential-free: the package is
# stdlib-only and the tests inject a fake GitHub API, so nothing here calls GitHub or AWS.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pytest
      - name: Lint
        run: ruff check merge
      - name: Test
        run: pytest
